version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mizan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mizan_db
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mizan']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mizan-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
